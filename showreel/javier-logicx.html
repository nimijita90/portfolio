<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Javier Ortiz — LogicX clip</title>
<!--
  A standalone clip for Javier's showreel, made from screenshots of LogicX supplied by María (media/javier/logicx-*.png):
  the camera travels the rule node by node, pulls back to the whole rule, then the action panel slides in and "Help" is clicked.
  Render: PAGE=javier-logicx.html node render.mjs 1 60 out/javier-logicx.mp4
-->
<style>
html,body{margin:0;background:#121514;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#121514}
.abs{position:absolute}
#card{left:160px;top:90px;width:1600px;height:900px;border-radius:20px;overflow:hidden;outline:1px solid #39403b;outline-offset:-1px;background:#16151f}
#cv{position:absolute;left:0;top:0;width:2200px;height:1237px;transform-origin:0 0}
.panel{position:absolute;width:630px;height:822px;border-radius:18px;overflow:hidden;outline:1px solid rgba(0,0,0,.08)}
.panel img{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="stage">
  <div class="abs" id="card"><img id="cv" src="media/javier/logicx-canvas.png" alt=""></div>
  <div class="panel" id="pO" style="left:1180px;top:129px"><img src="media/javier/logicx-panel-overview.png" alt=""></div>
  <div class="panel" id="pH" style="left:1180px;top:129px;opacity:0"><img src="media/javier/logicx-panel-help.png" alt=""></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
// camera on the canvas: frame image point (px, py) at the centre of the 1600×900 card, at scale s (1 = native pixels)
const cam = (px, py, s) => ({ x: 800 - px * s, y: 450 - py * s, scale: s });
const FIT = 1600 / 2200;
gsap.set("#cv", cam(210, 680, 1.15));
tl.fromTo("#card", { opacity: 0, scale: .94, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: .7, ease: "expo.out" }, 0);
// node by node along the flow: Start → Filter → Report block → Temp Store → Send Message
tl.to("#cv", { ...cam(620, 690, 1.15), duration: .7, ease: "power3.inOut" }, .55);
tl.to("#cv", { ...cam(1008, 420, 1.15), duration: .7, ease: "power3.inOut" }, 1.3);
tl.to("#cv", { ...cam(1375, 725, 1.15), duration: .7, ease: "power3.inOut" }, 2.05);
tl.to("#cv", { ...cam(1790, 600, 1.15), duration: .7, ease: "power3.inOut" }, 2.8);
// pull back to the whole rule
tl.to("#cv", { ...cam(1100, 618.5, FIT), duration: 1.0, ease: "expo.inOut" }, 3.55);
// the action panel slides in over the rule, "Help" is clicked and the panel switches to the help view
tl.to("#card", { x: -260, scale: .92, opacity: .55, duration: .8, ease: "expo.inOut" }, 4.75);
tl.fromTo(".panel", { x: 760 }, { x: 0, duration: .8, ease: "expo.inOut" }, 4.75);
tl.to("#pO", { scale: .985, duration: .08, yoyo: true, repeat: 1, transformOrigin: "26% 6%" }, 6.0);
tl.to("#pH", { opacity: 1, duration: .25 }, 6.12);
tl.set({}, {}, 7.6);

window.DURATION = 7.6;
window.seek = async (t) => { tl.seek(Math.max(t, 1e-4), false); };
window.ready = Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => i.onload = r)));
const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById("stage").style.transform = `scale(${s})`; };
if (!new URLSearchParams(location.search).has("render")) { addEventListener("resize", fit); fit(); window.ready.then(() => tl.play()); }
</script>
</body>
</html>
